l_english:
 CGE_NEGOTIATION_REQUEST_TITLE:0 "[?cge_negotiation_partner^0.GetNameDefCap] Requests the Repatriation of Its Military Commanders"
 CGE_NEGOTIATION_REQUEST_DESC:0 "[?cge_negotiation_partner^0.GetNameDefCap] has formally requested the return of [?cge_negotiation_general_count|.0] unrecruited military commanders held in our custody. We may authorize their unconditional repatriation, require a temporary economic settlement in exchange for their return, or keep them detained.\n\nRecruited commanders and POW collaborators are handled separately under the postwar settlement."
 CGE_NEGOTIATION_RETURN:0 "Authorize their unconditional repatriation."
 CGE_NEGOTIATION_DEMAND:0 "Demand reparations for their repatriation."
 CGE_NEGOTIATION_KEEP:0 "Keep the commanders in custody."
 CGE_NEGOTIATION_RETURN_TT:0 "Return the §Y[?cge_negotiation_general_count|.0] eligible officers§! to §Y[?cge_negotiation_partner^0.GetNameDef]§!.\nTheir opinion of us increases by §G50§!.\n§YRecruited generals and POW collaborators§! are handled by their own postwar events."
 CGE_NEGOTIATION_DEMAND_TT:0 "Demand reparations for returning the eligible officers.\n\n§gThey are more likely to accept when the commanders being returned are more valuable and relations are better.§!\n\nA reply arrives in §Yone day§!."
 CGE_NEGOTIATION_REFUSE_TT:0 "Keep the eligible officers imprisoned. Their current §YPatience§! and §YCooperation§! are both §Rhalved§!, and their normal weekly decay is §Rdoubled§! for the rest of this captivity. Existing operation pauses and recruitment protections still apply.\n\nAn independent recipient loses §R50 opinion§! of us and §Rembargoes us§!. Our subject loses only §R25 opinion§! and imposes §Yno embargo§!."
 CGE_NEGOTIATION_ACCEPTED_TITLE:0 "[?cge_negotiation_partner^0.GetNameDefCap] Accepts Our Repatriation Terms"
 CGE_NEGOTIATION_ACCEPTED_DESC:0 "[?cge_negotiation_partner^0.GetNameDefCap] has accepted the proposed economic settlement for the return of its military commanders. For 170 days, our Consumer Goods Factor will be reduced by [?cge_negotiation_reparations_percent|.0]%, while theirs will be increased by [?cge_negotiation_reparations_payer_percent|.0]%.\n\nThe commanders will be transferred once we sign the agreement."
 CGE_NEGOTIATION_SIGN:0 "Sign the repatriation agreement."
 CGE_NEGOTIATION_SIGN_TT:0 "Return §Y[?cge_negotiation_general_count|.0] eligible officers§! to §Y[?cge_negotiation_partner^0.GetNameDef]§!.\nFor §Y170 days§!, gain §YReparations Receipts§! with §G-[?cge_negotiation_reparations_percent|.0]% Consumer Goods Factor§!.\nThey gain §YReparations Obligations§! with §R+[?cge_negotiation_reparations_payer_percent|.0]% Consumer Goods Factor§! for the same period."
 CGE_NEGOTIATION_REFUSED_TITLE:0 "[?cge_negotiation_partner^0.GetNameDefCap] Rejects Our Repatriation Terms"
 CGE_NEGOTIATION_REFUSED_DESC:0 "[?cge_negotiation_partner^0.GetNameDefCap] has rejected our demand for reparations in exchange for the return of [?cge_negotiation_general_count|.0] unrecruited military commanders. The original repatriation request remains unresolved.\n\nWe can release the commanders without conditions or end the talks and keep them in custody."
 CGE_NEGOTIATION_RETURN_AFTER_REFUSAL:0 "Authorize their unconditional repatriation."
 CGE_NEGOTIATION_KEEP_AFTER_REFUSAL:0 "Keep the commanders in custody."
 cge_reparations_received:0 "Reparations Receipts"
 cge_reparations_received_desc:0 "§gEconomic concessions received in exchange for the repatriation of captured military commanders.§!"
 cge_reparations_paid:0 "Reparations Obligations"
 cge_reparations_paid_desc:0 "§gEconomic concessions paid in exchange for the return of captured military commanders.§!"
