 CGE_REPARATIONS_DURATION_TT:0 "§gThe scale of reparations reflects the industrial capacity and relative economic strength of the participating countries, as well as the number and quality of the commanders repatriated.§!"
 CGE_REPARATIONS_RECEIVED_TT:0 "§gThe scale of these receipts reflects the paying countries' industrial capacity, relative economic strength, and the number and quality of commanders repatriated.§!"
 CGE_REPARATIONS_PAID_TT:0 "§gThe burden of these obligations reflects our industrial capacity, relative economic strength, and the number and quality of commanders repatriated.§!"
