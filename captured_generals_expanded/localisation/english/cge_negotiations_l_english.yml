 cge_reparations_received_spirit_desc:0 "§gEconomic concessions received in exchange for the repatriation of captured military commanders.§!"
 cge_reparations_paid_spirit:0 "Reparations Obligations"
 cge_reparations_paid_spirit_desc:0 "§gEconomic concessions paid in exchange for the return of captured military commanders.§!"
