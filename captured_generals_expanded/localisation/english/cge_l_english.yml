 CGE_EXECUTION_EVENT_TITLE:0 "The Execution of [Root.CGEGetExecutionGeneralName]"
 CGE_EXECUTION_EVENT_DESC:0 "The sentence has been carried out. [Root.CGEGetExecutionGeneralRank] [Root.CGEGetExecutionGeneralName], a captured [Root.CGEGetExecutionOriginAdjective] officer of [Root.CGEGetExecutionOriginNameDef], has been executed by order of the government of [Root.CGEGetExecutionCaptorNameDef]. The government presents the decision as a necessary act against an enemy commander. At home, the execution has stiffened resolve; in [Root.CGEGetExecutionOriginNameDef], the loss will be remembered very differently."
 CGE_EXECUTION_EVENT_OPTION_TT:0 "The execution of §Y[Root.CGEGetExecutionGeneralName]§! has political consequences:\nWar Support: §G+5.00%§!\n[Root.CGEGetExecutionOriginNameDef] War Support: §R-5.00%§!"
 CGE_EXECUTION_NEWS_TITLE:0 "Captured [Root.CGEGetExecutionOriginAdjective] General Executed"
 CGE_EXECUTION_NEWS_DESC:0 "[Root.CGEGetExecutionCaptorNameDef] has announced the execution of [Root.CGEGetExecutionGeneralRank] [Root.CGEGetExecutionGeneralName], a captured [Root.CGEGetExecutionOriginAdjective] commander from [Root.CGEGetExecutionOriginNameDef]. Officials in [Root.CGEGetExecutionCaptorNameDef] described the execution as the conclusion of proceedings against the officer. The announcement has prompted strong reactions in [Root.CGEGetExecutionOriginNameDef] and is likely to deepen hostility between the two countries."
 CGE_RECRUITMENT_EVENT_DESC:0 "On [?cge_cge_recruitment_date.GetDateStringNoHourLong], [Root.GetName] formally renounced his former allegiance and chose to fight for [From.GetNameDef]. His experience and knowledge will now serve our army—though only time will show whether his new loyalty is genuine."
 CGE_TRIAL_STAGE1_TITLE:0 "The Case Against [Root.CGEGetTrialGeneralName]"
 CGE_TRIAL_STAGE1_DESC:0 "The files on [Root.CGEGetTrialGeneralName] have been assembled into a case. Prosecutors, military officers, and propagandists all see a different use for the proceedings. Before the first witnesses are called, we must decide what this trial is meant to accomplish."
 CGE_TRIAL_STAGE2_TITLE:0 "The Prisoner Takes the Stand"
 CGE_TRIAL_STAGE2_CONFESSION_DESC:0 "[Root.CGEGetTrialGeneralName] has chosen cooperation over defiance. The testimony is guarded, but there are admissions our prosecutors can use. How aggressively we exploit them will shape the rest of the case."
 CGE_TRIAL_STAGE2_DEFIANCE_DESC:0 "[Root.CGEGetTrialGeneralName] refuses to give the court what it wants. The prisoner disputes the charges, challenges witnesses, and treats the proceedings as political theatre. We can escalate, preserve the court's credibility, or offer a path toward cooperation."
 CGE_TRIAL_STAGE3_TITLE:0 "How Far Do We Go?"
 CGE_TRIAL_STAGE3_PUBLIC_DESC:0 "The trial has become a public spectacle. Newspapers and broadcasters are waiting for direction: turn every accusation into propaganda, or restrain the spectacle before it damages the credibility of the verdict."
 CGE_TRIAL_STAGE3_MILITARY_DESC:0 "The military court has heard enough to proceed. Senior officers disagree over whether the sentence should serve as an example or whether strict procedure matters more than severity."
 CGE_TRIAL_STAGE3_PLEA_DESC:0 "Negotiations with [Root.CGEGetTrialGeneralName] have reached their decisive point. A formal offer could secure cooperation now, while a harder line may extract better terms at the risk of collapsing the deal."
 CGE_TRIAL_STAGE4_TITLE:0 "The Verdict"
 CGE_TRIAL_STAGE4_DESC:0 "After months of hearings, the case against [Root.CGEGetTrialGeneralName] is ready for judgment. The court can impose a sentence, return the prisoner to confinement under a conviction, or —if enough ground has been prepared—close the case with a plea agreement."
