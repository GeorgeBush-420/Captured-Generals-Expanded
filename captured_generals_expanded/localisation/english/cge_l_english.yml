 CGE_TRIAL_STAGE1_PUBLIC:0 "Turn it into a public show trial."
 CGE_TRIAL_STAGE1_PUBLIC_TT:0 "§YPublic Show Trial§!\nPlace the proceedings before the nation and make the prisoner's crimes part of the war effort.\nLater choices can turn a condemnation into a major §GWar Support§! reward, while a more restrained presentation can also improve §GStability§!."
 CGE_TRIAL_STAGE1_MILITARY:0 "Convene a military tribunal."
 CGE_TRIAL_STAGE1_MILITARY_TT:0 "§YMilitary Tribunal§!\nPlace the case in the hands of the armed forces and treat the prisoner primarily as an enemy commander.\nLater choices can provide §GCommand Power§!, §GArmy Experience§!, and political benefits depending on how the tribunal is conducted."
 CGE_TRIAL_STAGE1_PLEA:0 "Quietly explore a plea agreement."
 CGE_TRIAL_STAGE1_PLEA_TT:0 "§YPlea Negotiations§!\nKeep the proceedings quieter and use the threat of conviction as leverage against the prisoner.\nThis route favors §GCooperation§! and makes a final plea agreement—and eventual recruitment—more attractive."
 CGE_TRIAL_STAGE2_PRESS:0 "Turn every word against him."
 CGE_TRIAL_STAGE2_PRESS_TT:0 "§R-5% Patience§!.\nAggressively exploit the prisoner's testimony and portray every admission—or refusal to cooperate—as evidence against them.\nThis pushes the proceedings toward a §Rharsher final sentence§! and strengthens the propaganda value of a public trial."
 CGE_TRIAL_STAGE2_CREDIBLE:0 "Keep the proceedings credible."
 CGE_TRIAL_STAGE2_CREDIBLE_TT:0 "Keep the court measured and avoid appearing to manufacture the case.\nThe restrained proceedings reassure the public and immediately grant §G+5% Stability§!."
 CGE_TRIAL_STAGE2_LENIENCY:0 "There is still room for a deal."
 CGE_TRIAL_STAGE2_LENIENCY_TT:0 "Make it clear that further cooperation can still improve the prisoner's fate.\nGain §G+5% Cooperation§! and make a later §YPlea Agreement§! easier to justify."
 CGE_TRIAL_STAGE3_PUBLIC_BROADCAST:0 "Broadcast every damaging moment."
 CGE_TRIAL_STAGE3_PUBLIC_BROADCAST_TT:0 "Turn the proceedings into a full propaganda campaign and broadcast the prisoner's most damaging moments throughout the country.\nIf the final verdict is §YCondemn§!: §G+10% War Support§!.\nIf the final verdict is §YConvict§!: §G+7.5% War Support§!."
 CGE_TRIAL_STAGE3_PUBLIC_CONTROL:0 "Keep the spectacle under control."
 CGE_TRIAL_STAGE3_PUBLIC_CONTROL_TT:0 "Keep the trial public, but prevent the spectacle from becoming so blatant that the verdict appears predetermined.\nIf the final verdict is §YCondemn§!: §G+7.5% War Support§! and §G+5% Stability§!.\nIf the final verdict is §YConvict§!: §G+5% War Support§! and §G+5% Stability§!."
 CGE_TRIAL_STAGE3_MILITARY_EXAMPLE:0 "Demand an exemplary sentence."
 CGE_TRIAL_STAGE3_MILITARY_EXAMPLE_TT:0 "§R-5% Patience§!.\nDemand a sentence severe enough to serve as an example to enemy officers and our own armed forces.\nIf §YCondemned§!: §G+5% War Support§!, §G+50 Command Power§!, and §G+20 Army Experience§!.\nIf §YConvicted§!: §G+5% War Support§! and §G+20 Army Experience§!."
 CGE_TRIAL_STAGE3_MILITARY_LAW:0 "The tribunal will follow the law."
 CGE_TRIAL_STAGE3_MILITARY_LAW_TT:0 "Insist that the tribunal demonstrate discipline, procedure, and military law rather than vengeance.\nIf §YCondemned§!: §G+7.5% Stability§!, §G+30 Command Power§!, and §G+15 Army Experience§!.\nIf §YConvicted§!: §G+5% Stability§! and §G+25 Army Experience§!."
 CGE_TRIAL_STAGE3_PLEA_FORMAL:0 "Put leniency in writing."
 CGE_TRIAL_STAGE3_PLEA_FORMAL_TT:0 "Put a concrete offer of leniency before the prisoner and make cooperation the safest way out.\nGain §G+10% Cooperation§! immediately and substantially improve the case for accepting a final §YPlea Agreement§!."
 CGE_TRIAL_STAGE3_PLEA_HOLD:0 "Make him earn every concession."
 CGE_TRIAL_STAGE3_PLEA_HOLD_TT:0 "Offer no concessions yet. Make the prisoner prove that their cooperation is worth leniency.\nA plea agreement remains possible, but on harder terms. If one is ultimately accepted, gain §G+20 Command Power§!."
 CGE_TRIAL_STAGE4_CONDEMN:0 "Condemn the prisoner."
 CGE_TRIAL_STAGE4_CONDEMN_TT:0 "§R-15% Patience§! and mark the prisoner §RCondemned§!.\nThe reward depends on how the trial was conducted:\n§YPublic propaganda campaign§!: up to §G+10% War Support§!.\n§YControlled public proceedings§!: §G+7.5% War Support§! and §G+5% Stability§!.\n§YMilitary exemplary sentence§!: §G+5% War Support§!, §G+50 Command Power§!, and §G+20 Army Experience§!.\n§YLegalistic military tribunal§!: §G+7.5% Stability§!, §G+30 Command Power§!, and §G+15 Army Experience§!."
 CGE_TRIAL_STAGE4_CONVICT:0 "Convict him and return him to confinement."
 CGE_TRIAL_STAGE4_CONVICT_TT:0 "§R-10% Patience§! and return the prisoner to confinement under a formal conviction.\nThe reward depends on how the trial was conducted:\n§YPublic propaganda campaign§!: §G+7.5% War Support§!.\n§YControlled public proceedings§!: §G+5% War Support§! and §G+5% Stability§!.\n§YMilitary exemplary sentence§!: §G+5% War Support§! and §G+20 Army Experience§!.\n§YLegalistic military tribunal§!: §G+5% Stability§! and §G+25 Army Experience§!."
 CGE_TRIAL_STAGE4_PLEA:0 "Accept the plea agreement."
 CGE_TRIAL_STAGE4_PLEA_TT:0 "Accept a negotiated settlement instead of imposing a conventional sentence.\nGain §G+25% Cooperation§! and §G+5% Patience§!. A trial that was focused on negotiation grants an additional §G+10% Cooperation§!.\nFor §Y70 days§!, Recruit General requires only §Y50% Cooperation§! and §Y25% Patience§!."
 CGE_EXECUTION_EVENT_OPTION:0 "Let this be a warning to our enemies."
 CGE_EXECUTION_NEWS_OPTION_EXECUTOR:0 "He got what he deserved."
 CGE_EXECUTION_NEWS_OPTION_ORIGIN:0 "We will not forget this."
 CGE_EXECUTION_NEWS_OPTION_THIRD:0 "Oh, the humanity."
