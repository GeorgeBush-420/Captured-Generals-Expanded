 CGE_PATIENCE_WEEKLY_DECAY_TT:0 "§YWeekly Patience Decay§!\nNormally: §R-1% every 7 days§!.\nDuring §YHarsher Confinement§!: §R-2% every 7 days§!.\nDuring §YEased Confinement§! and its 70-day after-effect: §G0%§!."
 CGE_COOPERATION_WEEKLY_DECAY_TT:0 "§YWeekly Cooperation Decay§!\nCooperation naturally falls every 7 days according to the prisoner's current Patience:\n§Y76-100 Patience:§! §R-0.5%§!\n§Y51-75 Patience:§! §R-1%§!\n§Y26-50 Patience:§! §R-1.5%§!\n§Y1-25 Patience:§! §R-2%§!\n§Y0 Patience:§! §R-3%§!\nKeeping Patience high therefore makes gained Cooperation substantially easier to retain."
