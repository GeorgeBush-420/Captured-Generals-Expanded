l_english:
 CGE_POSTWAR_AUTONOMY_ACCEPT:0 "Restore the country under our protection."
 CGE_POSTWAR_AUTONOMY_ACCEPT_TT:0 "[Root.CGEGetPostwarSelectedOriginNameDef] is restored as our puppet. States where we possess a core or claim remain ours."
 CGE_POSTWAR_AUTONOMY_DENY:0 "The matter is settled. Refuse."
 CGE_POSTWAR_AUTONOMY_DENY_TT:0 "§R-100§! Political Power\n[Root.CGEGetPostwarSelectedGeneralName] loses his collaboration status and returns to captivity."
 CGE_POSTWAR_AUTONOMY_DESC:0 "[Root.CGEGetPostwarSelectedGeneralName] insists that cooperation with us during the war did not amount to accepting the permanent disappearance of [Root.CGEGetPostwarSelectedOriginNameDef]. He now demands the restoration of an autonomous government under our protection."
 CGE_POSTWAR_AUTONOMY_IMPOSSIBLE:0 "Restoration is impossible."
 CGE_POSTWAR_AUTONOMY_IMPOSSIBLE_TT:0 "No eligible homeland territory can be restored without surrendering our own cores or claims."
 CGE_POSTWAR_AUTONOMY_TITLE:0 "[Root.CGEGetPostwarSelectedGeneralName] Demands the Restoration of [Root.CGEGetPostwarSelectedOriginNameDef]"
 CGE_POSTWAR_GOVERNOR_BACK:0 "Previous candidates"
 CGE_POSTWAR_GOVERNOR_CANCEL:0 "Cancel"
 CGE_POSTWAR_GOVERNOR_CANDIDATE_1:0 "[?ROOT.cge_postwar_candidate_1_display^0.GetName]"
 CGE_POSTWAR_GOVERNOR_CANDIDATE_1_TT:0 "Install [?ROOT.cge_postwar_candidate_1_display^0.GetName] as military governor of [Root.CGEGetPostwarSelectedOriginNameDef]."
 CGE_POSTWAR_GOVERNOR_CANDIDATE_2:0 "[?ROOT.cge_postwar_candidate_2_display^0.GetName]"
 CGE_POSTWAR_GOVERNOR_CANDIDATE_2_TT:0 "Install [?ROOT.cge_postwar_candidate_2_display^0.GetName] as military governor of [Root.CGEGetPostwarSelectedOriginNameDef]."
 CGE_POSTWAR_GOVERNOR_CANDIDATE_3:0 "[?ROOT.cge_postwar_candidate_3_display^0.GetName]"
 CGE_POSTWAR_GOVERNOR_CANDIDATE_3_TT:0 "Install [?ROOT.cge_postwar_candidate_3_display^0.GetName] as military governor of [Root.CGEGetPostwarSelectedOriginNameDef]."
 CGE_POSTWAR_GOVERNOR_LEADER_DESC:0 "Installed as military governor by his captors following the defeat of his country."
 CGE_POSTWAR_GOVERNOR_NAV:0 "Let's see the other candidates"
 CGE_POSTWAR_GOVERNOR_NEXT:0 "Next candidates"
 CGE_POSTWAR_GOVERNOR_PROPOSAL_DESC:0 "The new [Root.CGEGetPostwarSelectedOriginAdjective] government remains dependent upon our support. At least one officer from its former armed forces has remained in our service. Installing one of these proven collaborators as military governor could give the new regime local authority and a leader whose relationship with us is already established."
 CGE_POSTWAR_GOVERNOR_PROPOSAL_NO:0 "Leave the existing government in place."
 CGE_POSTWAR_GOVERNOR_PROPOSAL_TITLE:0 "A Military Governor for [Root.CGEGetPostwarSelectedOriginNameDef]?"
 CGE_POSTWAR_GOVERNOR_PROPOSAL_YES:0 "Consider the candidates."
 CGE_POSTWAR_GOVERNOR_SELECT_DESC:0 "Which of our recruited [Root.CGEGetPostwarSelectedOriginAdjective] officers should be placed at the head of the new government?"
 CGE_POSTWAR_GOVERNOR_SELECT_TITLE:0 "Choose a Military Governor for [Root.CGEGetPostwarSelectedOriginNameDef]"
 CGE_POSTWAR_ORIGIN_ADJ_CURRENT:0 "[?ROOT.cge_postwar_origin_display^0.GetAdjective]"
 CGE_POSTWAR_ORIGIN_NAMEDEF_CURRENT:0 "[?ROOT.cge_postwar_origin_display^0.GetNameDef]"
 CGE_POSTWAR_ORIGIN_NAME_CURRENT:0 "[?ROOT.cge_postwar_origin_display^0.GetName]"
 CGE_POSTWAR_REPATRIATION_DESC:0 "With hostilities at an end, the enemy officers who remained ordinary prisoners in our custody have been released and repatriated under the postwar settlement."
 CGE_POSTWAR_REPATRIATION_OK:0 "The war is over. Send them home."
 CGE_POSTWAR_REPATRIATION_TITLE:0 "Captured Officers Repatriated"
 CGE_POSTWAR_RETURN_ACCEPT:0 "He has earned the right to go home."
 CGE_POSTWAR_RETURN_ACCEPT_TT:0 "[Root.CGEGetPostwarSelectedGeneralName] leaves our service and returns to [Root.CGEGetPostwarSelectedOriginNameDef]."
 CGE_POSTWAR_RETURN_DENY:0 "He serves us now. Deny the request."
 CGE_POSTWAR_RETURN_DENY_TT:0 "§R-100§! Political Power\n[Root.CGEGetPostwarSelectedGeneralName] loses his recruited and POW-recruiter status and is returned to captivity."
 CGE_POSTWAR_RETURN_DESC:0 "With the war against [Root.CGEGetPostwarSelectedOriginNameDef] concluded, the authorities there have offered pardons to officers who served under foreign command during their captivity. [Root.CGEGetPostwarSelectedGeneralName] has asked to be released from his obligations to us so that he may return home and rejoin the [Root.CGEGetPostwarSelectedOriginAdjective] armed forces."
 CGE_POSTWAR_RETURN_TITLE:0 "[Root.CGEGetPostwarSelectedGeneralName] Requests Repatriation"
 CGE_POSTWAR_UNKNOWN_COUNTRY:0 "the former enemy country"
 CGE_POSTWAR_UNKNOWN_ADJECTIVE:0 "former enemy"
 CGE_POSTWAR_UNKNOWN_GENERAL:0 "Unknown Officer"
 cge_eager_collaborator:0 "Eager Collaborator"
 cge_eager_collaborator_desc:0 "A collaborator installed as head of government following the defeat of his homeland."
 cge_postwar_eager_collaborator:0 "Eager Collaborator"
 cge_postwar_eager_collaborator_desc:0 "A willing collaborator whose government is kept under unusually close control by its overlord."
 CGE_POSTWAR_DESTINATION_NAMEDEF_CURRENT:0 "[?ROOT.cge_postwar_destination_display^0.GetNameDef]"
 CGE_POSTWAR_DESTINATION_NAME_CURRENT:0 "[?ROOT.cge_postwar_destination_display^0.GetName]"
 CGE_POSTWAR_DESTINATION_ADJ_CURRENT:0 "[?ROOT.cge_postwar_destination_display^0.GetAdjective]"
 CGE_POSTWAR_FATE_TITLE:0 "The fate of General [Root.CGEGetPostwarSelectedGeneralName]"
 CGE_POSTWAR_FATE_RETURN_DESC:0 "[Root.CGEGetPostwarSelectedGeneralName] has made clear that, with the war now over, he wishes to leave our service and return to [Root.CGEGetPostwarSelectedOriginNameDef] rather than continue fighting for us."
 CGE_POSTWAR_FATE_STAY_DESC:0 "[Root.CGEGetPostwarSelectedGeneralName] has chosen of his own accord to remain in our service. Despite the end of the war, he wishes to continue fighting for us rather than return to [Root.CGEGetPostwarSelectedOriginNameDef]."
 CGE_POSTWAR_FATE_RETURN_OVERRULE:0 "Overruled. He is staying with us."
 CGE_POSTWAR_FATE_STAY_OVERRULE:0 "Overruled. He is going back to his country."
 CGE_POSTWAR_FATE_RESPECT_WISH:0 "Very well. If that is what he wishes."
 CGE_POSTWAR_FATE_RETURN_OVERRULE_TT:0 "§R-100§! Political Power\n[Root.CGEGetPostwarSelectedGeneralName]'s §YCooperation§! and §YPatience§! are cut in half. His recruited and POW-recruiter status is revoked, any active POW-recruiting assignment is ended, and he returns to captivity as a prisoner."
 CGE_POSTWAR_FATE_RETURN_RESPECT_TT:0 "[Root.CGEGetPostwarSelectedGeneralName] leaves our service and returns to [Root.CGEGetPostwarSelectedOriginNameDef]."
 CGE_POSTWAR_FATE_STAY_OVERRULE_TT:0 "§R-100§! Political Power\n[Root.CGEGetPostwarSelectedGeneralName] is released from our service and sent back to [Root.CGEGetPostwarSelectedOriginNameDef]."
 CGE_POSTWAR_FATE_STAY_RESPECT_TT:0 "[Root.CGEGetPostwarSelectedGeneralName] remains recruited and continues serving in our armed forces."
